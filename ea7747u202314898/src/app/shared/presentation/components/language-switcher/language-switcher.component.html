<mat-button-toggle-group
  [value]="languageStore.selectedLanguage()"
  (change)="languageStore.changeLanguage($event.value)"
  [attr.aria-label]="'language-switcher-label' | translate">
  @for (language of languageStore.supportedLanguages; track language) {
    <mat-button-toggle [value]="language">{{ language.toUpperCase() }}</mat-button-toggle>
  }
</mat-button-toggle-group>
